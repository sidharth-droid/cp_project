{% extends "complainapp/base1.html" %}
<script>
    document.addEventListener('DOMContentLoaded',function(){
        const manage = document.querySelector('#manage');
        manage.addEventListener('click',function(){
            let links = document.querySelectorAll('.sidebar a')
            links.forEach(function(link) {
            link.classList.remove('active');
            if (link.getAttribute('data-active') === 'manage-users') {
                link.classList.add('active');
            }
        })

    })

    
</script>
{% block content %}
<h1>User List</h1>
<a href="{% url 'user_create' %}" class="btn btn-primary mb-3">Create New User</a>
<a href="{% url 'group_list' %}" class="btn btn-primary mb-3">Group</a>

<form method="get" class="form-inline mb-3">
    <input type="text" name="search" class="form-control mr-2" placeholder="Search users" value="{{ request.GET.search }}">
    <button type="submit" class="btn btn-primary">Search</button>
</form>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.first_name }}</td>
            <td>{{ user.last_name }}</td>
            <td>
                <a href="{% url 'user_update' user.id %}" class="btn btn-warning btn-sm">Edit</a>
                <a href="{% url 'user_delete' user.id %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
