<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CP-Odisha{% endblock %}</title>
    <style>
        form {
            margin-top: 1rem;
            background-color: var(--color-white);
            padding: var(--card-padding);
            border-radius: var(--card-border-radius);
            box-shadow: var(--box-shadow);
        }
        * {
            appearance: checkbox;
        }
        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form input[type="checkbox"] {
            width: 100%;
            padding: 0.5rem;
            margin: 0.8rem 0;
            border-radius: var(--border-radius-2);
            border: 1px solid var(--color-dark-variant);
            box-sizing: border-box;
        }
        form input[type="checkbox"] {
            width: auto;
            display: inline-block;
        }
        form button {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background-color: var(--color-primary);
            color: var(--color-white);
            border: none;
            border-radius: var(--border-radius-2);
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }
        form button:hover {
            background: #e800d1;
        }
        ul {
            margin-bottom: 1rem;
        }
        @media screen and (max-width: 768px) {
            main {
                margin-top: 8rem;
                padding: 0 1rem;
            }
        }
        .errorlist {
            margin: 0;
            padding: 0;
            color: red;
            list-style-type: none;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .errorlist li {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <!-- Your header content -->
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
    </footer>
</body>
</html>
