{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - ComplainApp</title>
    <link rel="stylesheet" href="{% static 'css/admin_login.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body{
            text-decoration: none;
    list-style: none;
    appearance: none;
        }
        li{
            list-style: none;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let otpExpiryTime = {{ otp_expiry_time|default:0 }} *60 ;
            let timerElement = document.getElementById('timer');
            let resendForm = document.getElementById('resend-form');
            let verifyForm = document.getElementById('verify-form');
            let countdown = setInterval(function() {
                if (otpExpiryTime <= 0) {
                    clearInterval(countdown);
                    timerElement.textContent = "OTP has expired. Please request a new one.";
                    verifyForm.style.display = 'none';
                    resendForm.style.display = 'block'; 
                } else {
                    otpExpiryTime--;
                    let minutes = Math.floor(otpExpiryTime / 60);
                    let seconds = otpExpiryTime % 60;
                    timerElement.textContent = `OTP expires in ${minutes}m ${seconds}s`;
                }
            }, 1000);
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Verify OTP</h2>
            <form method="post" id="verify-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Verify</button>
            </form>
            <form id="resend-form" method="post" action="{% url 'resend_otp' %}" style="display: none;">
                {% csrf_token %}
                <button id="resend-btn" type="submit" class="btn resend-btn">Resend OTP</button>
            </form>
            {% if otp_expiry_time %}
            <p>OTP will expire in {{ otp_expiry_time }} minutes.</p>
            {% endif %}
            
            <!-- <form method="post" action="{% url 'resend_otp' %}">
                {% csrf_token %}
                <button type="submit" class="btn">Resend OTP</button>
            </form> -->
            <p id="timer"></p>
            
            
        </div>
    </div>
</body>
</html>
