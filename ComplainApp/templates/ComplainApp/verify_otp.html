{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - ComplainApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
    text-decoration: none;
    list-style: none;
    appearance: none;
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(to right, #6a11cb, #2575fc);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #fff;
    
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    width: 100%;
}
li{
            list-style: none;
        }
.login-box {
    background: #ffffff;
    border-radius: 8px;
    padding: 40px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), 0 4px 16px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 400px;
    text-align: center;
    color: #333;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.login-box:hover {
    transform: translateY(-10px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2), 0 8px 32px rgba(0, 0, 0, 0.3);
}

.login-box h2 {
    margin-bottom: 20px;
    font-size: 24px;
    font-weight: 500;
    color: #6a11cb;
}

.input-group {
    margin-bottom: 20px;
    position: relative;
}

.input-group label {
    font-size: 14px;
    color: #666;
    position: absolute;
    top: -10px;
    left: 20px;
    background: #fff;
    padding: 0 5px;
}

.input-group input {
    width: 90%;
    padding: 10px 20px;
    border-radius: 4px;
    border: 1px solid #ddd;
    font-size: 16px;
    color: #333;
    outline: none;
    transition: border-color 0.3s;
}

.input-group input:focus {
    border-color: #6a11cb;
}

.btn {
    display: block;
    width: 100%;
    padding: 10px 0;
    border: none;
    border-radius: 4px;
    background: #6a11cb;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.3s;
}

.btn:hover {
    background: #2575fc;
}
.red-text{
    padding-top: 2%;
    color: red;
    font-weight: bold;
}
    </style>
        
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let otpExpiryTime = {{ otp_expiry_time|default:0 }} *60 ;
            let timerElement = document.getElementById('timer');
            let resendForm = document.getElementById('resend-form');
            let verifyForm = document.getElementById('verify-form');
            let countdown = setInterval(function() {
                if (otpExpiryTime <= 0) {
                    clearInterval(countdown);
                    timerElement.textContent = "OTP has expired. Please request a new one.";
                    verifyForm.style.display = 'none';
                    resendForm.style.display = 'block'; 
                } else {
                    otpExpiryTime--;
                    let minutes = Math.floor(otpExpiryTime / 60);
                    let seconds = otpExpiryTime % 60;
                    timerElement.textContent = `OTP expires in ${minutes}m ${seconds}s`;
                }
            }, 1000);
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Verify OTP</h2>
            <form method="post" id="verify-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Verify</button>
            </form>
            <form id="resend-form" method="post" action="{% url 'resend_otp' %}" style="display: none;">
                {% csrf_token %}
                <button id="resend-btn" type="submit" class="btn resend-btn">Resend OTP</button>
            </form>
            {% if otp_expiry_time %}
            <p>OTP will expire in {{ otp_expiry_time }} minutes.</p>
            {% endif %}
            <p id="timer"></p>
            
            
        </div>
    </div>
</body>
</html>
